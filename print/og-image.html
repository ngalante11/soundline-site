<!doctype html>
<!--
  Source for og-image.png, the 1200 x 630 picture a link to the site shows in
  a text message, on Facebook and in search. Regenerate: node tools/og-image.js

  It must agree with the site's header: the mark, the promise in the day bar's
  three colors, and the location line (North Shore, Long Island).
-->
<html lang="en"><head><meta charset="utf-8">
<title>Soundline School — link preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{--deep:#12222B;--beacon:#F2C14E;--shallows:#5FB4E6;--glow:#7FE0C9;--paper:#F7F5F0;--making:#FF5A7A}
  html,body{margin:0}
  body{width:1200px;height:630px;box-sizing:border-box;background:var(--deep);color:var(--paper);padding:64px 72px 58px;display:flex;flex-direction:column;justify-content:space-between;font-family:"Instrument Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .lockup{display:flex;align-items:center;gap:22px}
  .lockup svg{width:78px;height:78px;flex:none}
  .wm{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:800;font-size:42px;letter-spacing:-.045em;line-height:1;text-transform:uppercase}
  h1{margin:0;font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:800;font-size:68px;line-height:1;letter-spacing:-.045em}
  h1 span{display:block}
  .a{color:var(--shallows)} .b{color:var(--making)} .c{color:var(--beacon)}
  .say{margin:18px 0 0;font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:31px;line-height:1.2}
  .foot{border-top:3px solid var(--glow);padding-top:20px;font-weight:600;font-size:23px;color:var(--glow)}
</style></head>
<body>
  <div class="lockup">
    <svg viewBox="0 0 160 160" aria-hidden="true">
      <path d="M80 24 L88 56 L120 64 L88 72 L80 104 L72 72 L40 64 L72 56 Z" fill="#F2C14E" stroke="#F7F5F0" stroke-width="7" stroke-linejoin="round"/>
      <path d="M44 24 L52 32 M116 24 L108 32 M80 6 V12" stroke="#F7F5F0" stroke-width="6" stroke-linecap="round"/>
      <path d="M12 122 H148" stroke="#F7F5F0" stroke-width="9" stroke-linecap="round"/>
      <path d="M14 144 C28 134, 40 154, 54 144 S80 134, 94 144 S120 154, 134 144 L146 136" stroke="#7FE0C9" stroke-width="8" stroke-linecap="round" fill="none"/>
    </svg>
    <span class="wm">Soundline</span>
  </div>
  <div>
    <h1><span class="a">Two hours of practice.</span><span class="b">Four hours of making.</span><span class="c">Every adult knows your kid.</span></h1>
    <p class="say">Depth with direction.</p>
  </div>
  <div class="foot">soundlineschool.com · Grades 6–8 · North Shore, Long Island · Opening September 2027</div>
</body></html>
